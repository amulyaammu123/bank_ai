name: Selenium End-to-End Test Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Automation Dependencies
        run: npm install

      - name: Execute 300 E2E Selenium & Mobile Test Suite
        run: npm run test:300

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-300-Test-Report
          path: |
            test_cases_300.md
            excel/SafeBank_300_Test_Cases.xlsx
