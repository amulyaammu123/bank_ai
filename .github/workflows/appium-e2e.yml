name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          # The debug APK will be generated at: ./app/build/outputs/apk/debug/app-debug.apk

      - name: Run Appium E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Install Appium and UIAutomator2 Driver
            npm install -g appium@latest
            appium driver install uiautomator2
            
            # Start Appium Server in the background
            appium --log ./logs/appium_server.log &
            
            # Install project test dependencies
            npm install
            
            # Run the test runner
            USE_APK=true APK_PATH=./app/build/outputs/apk/debug/app-debug.apk npm test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            excel/Mobile_E2E_Report.xlsx
            reports/
            logs/
            screenshots/
          retention-days: 14
