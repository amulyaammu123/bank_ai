name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium
    
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          # The debug APK will be generated at: ./app/build/outputs/apk/debug/app-debug.apk

      - name: Run Appium E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Set Appium Home directory locally inside workspace
            export APPIUM_HOME=$PWD/.appium
            
            # Ensure output directories exist
            mkdir -p logs reports excel screenshots
            
            # Install project test dependencies (including Appium and UIAutomator2 Driver)
            npm install
            
            # Register UIAutomator2 Driver in Appium Home
            npx appium driver install uiautomator2
            
            # Start Appium Server in the background
            npx appium --log ./logs/appium_server.log > ./logs/appium_startup.log 2>&1 &
            
            # Wait 15 seconds for Appium server to start
            sleep 15
            
            # Run the test runner
            USE_APK=true APK_PATH=./app/build/outputs/apk/debug/app-debug.apk PLATFORM_VERSION="12.0" npm test

      - name: Print Appium Server Logs on Failure
        if: failure()
        run: |
          if [ -f logs/appium_startup.log ]; then
            echo "=== APPIUM STARTUP LOGS ==="
            cat logs/appium_startup.log
          fi
          if [ -f logs/appium_server.log ]; then
            echo "=== APPIUM SERVER LOGS ==="
            tail -n 200 logs/appium_server.log
          else
            echo "Appium server log file not found."
          fi
          if [ -f logs/appium-execution.log ]; then
            echo "=== APPIUM EXECUTION LOGS ==="
            tail -n 200 logs/appium-execution.log
          else
            echo "Appium execution log file not found."
          fi
          node print_failures.js

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Appium-Report
          path: |
            excel/Mobile_E2E_Report.xlsx
            reports/
            logs/
            screenshots/
          retention-days: 14

      - name: Upload QA Test Case Suites Catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Test-Case-Suites
          path: |
            test_cases_300.md
            excel/SafeBank_300_Test_Cases.xlsx
